name: Deploy MCP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/var/mcp/MCP_test
            git pull
            npm install --legacy-peer-deps
            npm run build
            pm2 restart mcp || pm2 start dist/index.js --name mcp